services:
  postgres-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wbt_test
      POSTGRES_USER: wbt_test
      POSTGRES_PASSWORD: wbt_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbt_test -d wbt_test"]
      interval: 2s
      timeout: 3s
      retries: 20
