name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: wbt_test
          POSTGRES_USER: wbt_test
          POSTGRES_PASSWORD: wbt_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U wbt_test -d wbt_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, mbstring, xml, dom, bcmath, pdo_pgsql, pcntl, gd, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: find app routes database config tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:scorm
